<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact us</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<div id="siteHeader"></div>

<header class="page-hero"><div class="container">
  <h1>Contact us</h1>
  <p>Call, message, or send an inquiry and we will reply as soon as we can.</p>
</div></header>

<main class="section">
  <div class="container"><div class="row g-5">
    <div class="col-lg-5"><div class="d-grid gap-3">
      <div class="contact-card"><i class="bi bi-telephone"></i><div><div class="fw-semibold">Phone</div><a id="cPhone" href="#" class="text-decoration-none text-dark"></a></div></div>
      <div class="contact-card"><i class="bi bi-envelope"></i><div><div class="fw-semibold">Email</div><a id="cEmail" href="#" class="text-decoration-none text-dark"></a></div></div>
      <div class="contact-card"><i class="bi bi-geo-alt"></i><div><div class="fw-semibold">Address</div><div id="cAddress"></div></div></div>
      <div class="contact-card"><i class="bi bi-clock"></i><div><div class="fw-semibold">Open hours</div><div id="cHours"></div></div></div>
    </div></div>
    <div class="col-lg-7">
      <form id="inqForm" class="bg-paper p-4 rounded-3">
        <h2 class="h4 mb-3">Send an inquiry</h2>
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label" for="iName">Your name</label><input id="iName" class="form-control" required></div>
          <div class="col-md-6"><label class="form-label" for="iContact">Phone or email</label><input id="iContact" class="form-control" required></div>
          <div class="col-12"><label class="form-label" for="iType">I want to</label>
            <select id="iType" class="form-select"><option>Buy a car</option><option>Sell my car</option><option>Trade in my car</option><option>Ask something else</option></select></div>
          <div class="col-12"><label class="form-label" for="iMsg">Message</label><textarea id="iMsg" class="form-control" rows="4" required placeholder="Which car are you interested in?"></textarea></div>
          <div class="col-12"><button class="btn btn-accent px-4 py-2" type="submit">Send inquiry</button></div>
        </div>
      </form>
    </div>
  </div></div>
</main>

<div id="siteFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/chat.js"></script>
<script src="assets/js/contact.js"></script>

</body>
</html>
