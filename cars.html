<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cars for Sale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<div id="siteHeader"></div>

<header class="page-hero"><div class="container">
  <h1>Cars for sale</h1>
  <p>Filter by car type and brand, or search by model, year or color.</p>
</div></header>

<main class="section bg-paper" style="padding-top:2rem">
  <div class="container">
    <div class="filters mb-4">
      <div class="row g-3 align-items-end">
        <div class="col-12 col-md-5"><label class="form-label small" for="fQ">Search</label><input id="fQ" type="search" class="form-control" placeholder="Model, year, color..."></div>
        <div class="col-6 col-md-3"><label class="form-label small" for="fMax">Max price</label><input id="fMax" type="number" min="0" step="1000" class="form-control" placeholder="Any price"></div>
        <div class="col-6 col-md-2"><label class="form-label small" for="fSort">Sort</label>
          <select id="fSort" class="form-select"><option value="new">Newest listed</option><option value="lo">Price: low to high</option><option value="hi">Price: high to low</option><option value="year">Year: newest</option></select></div>
        <div class="col-12 col-md-2"><button class="btn btn-outline-dark btn-pill w-100" id="clear" type="button">Clear filters</button></div>
      </div>
      <div class="mt-3"><div class="small text-secondary mb-1">Condition</div><div class="d-flex flex-wrap gap-2" id="condChips"></div></div>
      <div class="mt-3"><div class="small text-secondary mb-1">Car type</div><div class="d-flex flex-wrap gap-2" id="typeChips"></div></div>
      <div class="mt-3"><div class="small text-secondary mb-1">Brand</div><div class="d-flex flex-wrap gap-2" id="brandChips"></div></div>
    </div>
    <p class="small text-secondary" id="count"></p>
    <div class="row g-3" id="grid"></div>
  </div>
</main>

<div id="siteFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/chat.js"></script>
<script src="assets/js/cars.js"></script>

</body>
</html>
